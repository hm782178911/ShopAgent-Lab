[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-grpo-sglang"
version = "0.1.0"
description = "ShopSimulator shopping-agent post-training and trajectory evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tqdm>=4.66,<5",
  "pyyaml==6.0.3",
  "modelscope>=1.34,<2",
]

[project.optional-dependencies]
eval = []
# CUDA training packages are provided by scripts/setup.sh and configs/runtime.json.
# They inherit the validated SGLang environment rather than resolving a second stack.
sft-accelerated = [
  "bitsandbytes>=0.45,<1",
  "liger-kernel>=0.6,<1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
shopping-grpo = "shopping_grpo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shopping_grpo.resources" = ["*.json"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
packages = ["shopping_grpo"]
ignore_missing_imports = true

# Reproduction target: Linux x86_64 with NVIDIA CUDA.
